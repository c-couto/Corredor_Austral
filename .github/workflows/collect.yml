# IMPORTANTE: no renombrar este archivo ni quitar `workflow_dispatch`:
# cron-job.org dispara este workflow por su nombre de archivo (collect.yml).
name: collect

on:
  schedule:
    # Cada 30 minutos (minutos 7 y 37, para evitar el pico de las horas en punto).
    # Si te quedás sin minutos gratis del mes, pasalo a una vez por hora: "7 * * * *"
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Recolectar datos
        run: python3 -m corredor run

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "corredor-bot"
          git config user.email "corredor-bot@users.noreply.github.com"
          git add data/auto/
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      # BETA: avisa por Telegram si cambió el riesgo por viento. Va DESPUÉS de guardar
      # los datos y aunque falle no marca error: los datos son lo más importante.
      # Sin los Secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID no envía nada.
      - name: Avisar por Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CORREDOR_SITE_URL: ${{ vars.CORREDOR_SITE_URL }}
        run: python3 -m corredor notify
