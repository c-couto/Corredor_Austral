# IMPORTANTE: no renombrar este archivo ni quitar `workflow_dispatch`:
# cron-job.org dispara este workflow por su nombre de archivo (collect.yml).
#
# Costo: un solo trabajo de ~1 minuto por corrida. Con 48 corridas por día son
# ~1.440 min/mes, dentro de los 2.000 gratis de GitHub para repos privados.
# Leer TABSA usa el Chrome que ya trae el servidor: no se instala nada.
name: collect

on:
  schedule:
    # Cada 30 minutos (minutos 7 y 37, para evitar el pico de las horas en punto).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # Opcional: con un contacto, el clima pasa a MET Norway (permite uso comercial).
      CORREDOR_MET_CONTACT: ${{ vars.CORREDOR_MET_CONTACT }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Navegador disponible
        run: google-chrome --version || chromium --version || echo "::warning::No hay Chrome; no se podrá leer TABSA"

      - name: Recolectar datos (clima + TABSA)
        run: python3 -m corredor run

      # Una vez por día: el modelo de riesgo aprende de todos los datos guardados (segundos).
      - name: Reentrenar el modelo
        continue-on-error: true
        run: python3 -m corredor train --if-stale

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "corredor-bot"
          git config user.email "corredor-bot@users.noreply.github.com"
          git add data/auto/ data/model/
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      # Avisa por Telegram si TABSA cambió un estado o si cambió el riesgo por viento.
      # Va DESPUÉS de guardar los datos y aunque falle no marca error: los datos son lo
      # más importante. Sin los Secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID no envía nada.
      - name: Avisar por Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CORREDOR_SITE_URL: ${{ vars.CORREDOR_SITE_URL }}
        run: python3 -m corredor notify
