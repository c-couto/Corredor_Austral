# Corre las pruebas automáticas cuando cambia el código (no con los commits de datos).
name: tests

on:
  push:
    paths:
      - "corredor/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # La versión mínima que soportamos y la más nueva estable.
        # Si GitHub deja de ofrecer alguna para ubuntu-latest, ver qué versiones hay en:
        # https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pruebas
        run: python -m unittest -v
