[project]
name = "corredor-austral"
version = "0.4.0"
description = "Recolector de datos para el cruce del Estrecho de Magallanes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # solo biblioteca estándar

[project.scripts]
corredor = "corredor.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corredor*"]
